# ローカル開発環境。
#
#   docker compose up -d   → http://localhost:8080  （サイト）
#                            http://localhost:8025  （送信メールの確認）
#
# テーマだけをマウントしている。WordPress 本体・DB はコンテナ側に閉じ込め、
# リポジトリにはテーマのソースだけが残るようにしてある（納品物と一致させるため）。

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.6-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'SEIZO_DEV_MAIL_HOST', 'mailpit' );
    volumes:
      # 開発中のテーマ。ここだけがリポジトリの管理対象。
      - ./wp-content/themes/seizo:/var/www/html/wp-content/themes/seizo
      # 開発用のメール設定（本番には持っていかない）
      - ./dev/mu-plugins:/var/www/html/wp-content/mu-plugins
      - wp-data:/var/www/html

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  db-data:
  wp-data:
